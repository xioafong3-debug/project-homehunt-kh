<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>placeholder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="placeholder.css">
</head>
<body>
    <div class="placeholderr"> 
        <p>Enter your name</p>
    </div>



    
    <div class="contact">
        <h1> Book a Visit</h1>
        <p class="text"> Fill in the details below and we'll confirm your visit as soon as possible.</p>
        <form>
         <p class="p">Full Name</p>
            <input type="text" class="placeholder" placeholder="Enter your name">
        <p class="p">Email</p>
            <input type="text" class="placeholder" placeholder="Enter your email">
         <p class="p">Phone number</p>
            <input type="text" class="placeholder" placeholder="+855 869 642 88">
        <p class="p">Preferred date</p>
            <input type="date" class="placeholder" placeholder="Select date">
        <p class="p">Preferres time</p>
            <input type="time" class="placeholder" placeholder="Selection time">
         <p class="p">Message</p>
            <input type="text" class="placeholder-message" placeholder="Anything we should know?">
            <button class="btn"> <p class="text-send">   
                 <!-- Send icon -->
<i class="fa-solid fa-paper-plane"></i>Send</p>
            </button>
        </form>
    </div>
</body>
</html>
